name: VM tests

# test-vm/vm.sh boots a Fedora 44 cloud image in QEMU and takes about 20
# minutes with KVM. Hosted ubuntu-24.04 runners for public repositories expose
# /dev/kvm once the udev rule below grants access; without KVM vm.sh falls back
# to emulation, which is far too slow, so the job fails instead. It runs on
# demand and weekly, not on every pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm || { echo "::error::/dev/kvm is not available on this runner"; exit 1; }
      - name: Install QEMU
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          qemu-system-x86 qemu-utils xorriso openssh-client curl gnupg
      - name: Run the VM tests
        run: test-vm/vm.sh all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-vm-results
          path: test-vm-results/
          if-no-files-found: ignore
