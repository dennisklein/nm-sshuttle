name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-gi python3-pytest
      - name: Run the unit tests
        run: python3 -m pytest -q

  lab:
    # lab/run.sh builds network namespaces, veth links and nft tables, so it
    # needs a privileged root container (docs/design.md §5).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The lab's claims were verified with sshuttle 2.0.0 in an Ubuntu 24.04
    # container; the distributions' 1.3.x behaves differently in places.
    container:
      image: ubuntu:24.04
      # --init: the lab polls kill -0 on its children, which orphaned zombies
      # would satisfy forever when PID 1 does not reap them.
      options: --privileged --init
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends iproute2 nftables openssh-server \
            openssh-client curl python3 python3-venv util-linux procps ca-certificates
          python3 -m venv /opt/sshuttle
          /opt/sshuttle/bin/pip install sshuttle==2.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ssh-keygen -A
      - run: SSHUTTLE=/opt/sshuttle/bin/sshuttle lab/run.sh

  rpm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44"]
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Install build tools
        run: dnf -y install git rpm-build rpmlint dnf5-plugins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the RPM
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          spec=packaging/rpm/nm-sshuttle.spec
          version=$(rpmspec -q --qf '%{version}\n' --srpm "$spec")
          mkdir -p ~/rpmbuild/SOURCES
          git archive --format=tar.gz --prefix="nm-sshuttle-$version/" \
            -o ~/rpmbuild/SOURCES/"nm-sshuttle-$version.tar.gz" HEAD
          dnf -y builddep "$spec"
          rpmbuild -ba "$spec"
          mkdir dist
          cp ~/rpmbuild/RPMS/noarch/*.rpm ~/rpmbuild/SRPMS/*.rpm dist/
      - name: Lint
        run: rpmlint dist/*.rpm || true
      - name: Check that it installs
        run: |
          dnf -y install dist/nm-sshuttle-*.noarch.rpm
          rpm -ql nm-sshuttle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-fedora-${{ matrix.fedora }}
          path: dist/*.rpm

  deb:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "debian:13", name: debian-13}
          - {image: "ubuntu:26.04", name: ubuntu-26.04}
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper dh-python \
            fakeroot lintian meson ninja-build python3 python3-gi python3-pytest
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir dist
          cp ../nm-sshuttle_*.deb dist/
      - name: Lint
        run: lintian dist/*.deb || true
      - name: Check that it installs
        run: |
          apt-get install -y --no-install-recommends ./dist/nm-sshuttle_*.deb
          dpkg -L nm-sshuttle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.name }}
          path: dist/*.deb
