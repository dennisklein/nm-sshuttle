<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root may own the plugin's names or talk to them (design §4.8). -->
<busconfig>
  <policy user="root">
    <!-- the dispatcher and one plugin instance per activation, each under
         its own name below this prefix (docs/later/multiple-tunnels.md) -->
    <allow own_prefix="org.freedesktop.NetworkManager.sshuttle"/>
    <allow send_destination="org.freedesktop.NetworkManager.sshuttle"/>
    <allow send_destination="org.freedesktop.NetworkManager.sshuttle.Dispatcher"/>
    <!-- the instances' per-activation names (...Connection_N) cannot be
         listed, and dbus-broker denied calls that send_destination_prefix
         should have allowed: NetworkManager reaches them by interface -->
    <allow send_interface="org.freedesktop.NetworkManager.VPN.Plugin"/>
  </policy>
  <policy context="default">
    <deny own_prefix="org.freedesktop.NetworkManager.sshuttle"/>
    <deny send_destination="org.freedesktop.NetworkManager.sshuttle"/>
    <deny send_destination="org.freedesktop.NetworkManager.sshuttle.Dispatcher"/>
  </policy>
</busconfig>
