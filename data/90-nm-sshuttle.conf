# nm-sshuttle: keep the VPN's DNS link nmss0 unmanaged.
#
# A managed nmss0 files a second, non-VPN DNS entry after a reconnect, and
# that entry can take systemd-resolved's default route from the uplink
# (risk 11 in docs/design.md). The plugin checks after each connect and logs
# a warning if nmss0 is managed anyway.
#
# "+=" appends to the list. A plain "unmanaged-devices=" in another file
# replaces it, and a file of this name in /etc/NetworkManager/conf.d masks
# this one.
[keyfile]
unmanaged-devices+=interface-name:nmss0
